<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Energy levels | QUBE Lab</title><script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script><style>body{font:16px/1.45 system-ui,sans-serif;margin:auto;padding:20px;max-width:1200px;color:#172b4d}h1{margin-bottom:4px}.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px}.panel{border:1px solid #ced6e0;border-radius:13px;padding:17px}label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 3px}input:not([type=checkbox]),select,button{width:100%;box-sizing:border-box;padding:7px}input[type=range]{padding:0}output{display:block;color:#567}button{background:#205493;border:none;color:white;border-radius:6px;padding:12px;cursor:pointer;margin-top:18px}button:disabled{opacity:.6}.checks label{font-weight:400;margin:5px 0}.checks input{width:auto!important}.note{color:#526575;font-size:.9rem}#plot{height:590px}@media(max-width:790px){.layout{grid-template-columns:1fr}#plot{height:450px}}</style></head><body><h1>Energy levels</h1><p>QUBE Lab · RadicalPy radical-pair simulation</p><div class="layout"><section class="panel"><label>API URL<input type="url" id="api" value="https://qubelab-spin-api.onrender.com" /></label>
<label>Initial state<select id="initial_state"><option value="singlet" selected>Singlet (S)</option><option value="triplet" >Triplet (unpolarized)</option><option value="triplet_plus" >T+</option><option value="triplet_minus" >T−</option><option value="triplet_zero" >T0</option></select></label>
<label>Observable<select id="observable"><option value="singlet" selected>Singlet (S)</option><option value="triplet" >Triplet (unpolarized)</option><option value="triplet_plus" >T+</option><option value="triplet_minus" >T−</option><option value="triplet_zero" >T0</option></select></label>
<label>Hyperfine coupling (mT)<input id="hyperfine_mT" type="range" min="0" max="5" step="0.1" value="1.5"><output for="hyperfine_mT"></output></label>
<label>Exchange J (mT)<input id="exchange_mT" type="range" min="-5" max="5" step="0.1" value="0"><output for="exchange_mT"></output></label>
<label>Dipolar D (mT)<input id="dipolar_mT" type="range" min="-5" max="5" step="0.1" value="0"><output for="dipolar_mT"></output></label>
<label>Applied field B (mT)<input id="field_mT" type="range" min="0" max="50" step="1" value="5"><output for="field_mT"></output></label>
<label>Recombination rate (s⁻¹)<select id="recombination_rate_s"><option value="100000">10⁵</option><option value="1000000" selected>10⁶</option><option value="10000000">10⁷</option><option value="100000000">10⁸</option></select></label>
<label>Duration (µs)<input id="duration_us" type="range" min="0.1" max="5" step="0.1" value="2"><output for="duration_us"></output></label>
<label>Requested time step (ns)<select id="time_step_ns"><option value="2">2</option><option value="5">5</option><option selected value="10">10</option><option value="20">20</option><option value="50">50</option></select></label><label>Maximum sweep field (mT)<input id="field_max_mT" type="range" min="1" max="50" value="15"><output for="field_max_mT"></output></label><label>Field points<select id="field_points"><option>31</option><option selected>61</option><option>101</option></select></label><button type="button" id="run">Run simulation</button><p id="status" role="status" aria-live="polite"></p></section><section class="panel"><div id="plot"></div><p id="explanation" class="note">Energy branches are eigenvalues of the coherent RadicalPy Hamiltonian. Initial-state, observable and recombination controls are retained for consistency but do not affect energy eigenvalues.</p></section></div><script>
const ids=['initial_state','observable','hyperfine_mT','exchange_mT','dipolar_mT','field_mT','recombination_rate_s','duration_us','time_step_ns','field_max_mT','field_points'];
for(const input of document.querySelectorAll('input[type=range]')){const output=document.querySelector(`output[for="${input.id}"]`);const update=()=>{if(output)output.textContent=input.value};update();input.addEventListener('input',update)}
const run=document.getElementById('run'),status=document.getElementById('status');
run.onclick=async()=>{const api=document.getElementById('api').value.trim().replace(/\/+$/,'');const request={};for(const id of ids){const el=document.getElementById(id);request[id]=el.tagName==='SELECT' && ['initial_state','observable'].includes(id)?el.value:Number(el.value)};run.disabled=true;status.textContent='Computing…';try{const response=await fetch(`${api}/simulate/energy-levels`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(request)});const payload=await response.json();if(!response.ok)throw Error(typeof payload.detail==='string'?payload.detail:JSON.stringify(payload.detail));const data=payload.levels_MHz.map((v,i)=>({x:payload.field_mT,y:v,type:'scatter',mode:'lines',name:`Level ${i+1}`,line:{width:2}}));Plotly.react('plot',data,{title:'RadicalPy energy level diagram',xaxis:{title:'Magnetic field (mT)'},yaxis:{title:'Energy / h (MHz)'},margin:{l:70,r:15,b:65,t:60}},{responsive:true});document.getElementById('explanation').textContent=payload.note+` Calculation time: ${payload.elapsed_s ?? '?'} s.`;status.textContent='Simulation complete.'}catch(e){status.textContent='Simulation error: '+e.message}finally{run.disabled=false}};
</script></body></html>
